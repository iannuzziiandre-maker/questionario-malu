<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluxo">
<meta name="theme-color" content="#f5f4f8">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Fluxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Fluxo: uma coluna estreita, cartões espaçados, barra de abas fixa embaixo (celular primeiro). */
:root {
  --bg: #f5f4f8;
  --surface: #ffffff;
  --navy: #24365c;
  --ink: #24365c;
  --muted: #6f7790;
  --line: #e3e1ec;
  --sage: #8fa98a;
  --sage-soft: #e6eee4;
  --lilac: #9b82c9;
  --lilac-soft: #eee8f8;
  --rose: #c98b95;
  --sand: #d8b46a;
  --danger: #b5485a;
  --font: "Nunito", "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; padding: 18px 16px 110px; display: grid; gap: 16px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: .02em; }
.brand svg { width: 30px; height: 30px; }
h1 { font-size: 26px; font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.2; }
h2 { font-size: 18px; font-weight: 800; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.quote { font-style: italic; color: var(--muted); font-size: 14px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.link { justify-self: start; background: none; border: 0; color: var(--lilac); font-weight: 700; cursor: pointer; padding: 4px 0; }
.btn { border: 0; background: var(--navy); color: #fff; font-weight: 700; border-radius: 12px; padding: 10px 16px; cursor: pointer; }
.btn.soft { background: var(--lilac-soft); color: var(--navy); }
.btn.sage { background: var(--sage-soft); color: var(--navy); }
.btn.danger { background: #f6e3e6; color: var(--danger); }
.row { display: flex; align-items: center; gap: 10px; }
.list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .meta { color: var(--muted); font-size: 13px; }
.item.done .t { text-decoration: line-through; color: var(--muted); }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--sage); background: transparent; cursor: pointer; flex: none; display: grid; place-items: center; padding: 0; }
.check[aria-pressed="true"] { background: var(--sage); }
.check[aria-pressed="true"]::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.edit { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--lilac-soft); color: var(--navy); white-space: nowrap; }
.pill.warn { background: #f8eccd; color: #7a5a12; }
.pill.late { background: #f6e3e6; color: var(--danger); }
.pill.ok { background: var(--sage-soft); color: #3d5a39; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 4px; text-align: left; cursor: pointer; }
.tile .k { font-size: 13px; color: var(--muted); font-weight: 700; }
.tile .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sage); border-radius: 99px; }
.water { display: flex; gap: 6px; flex-wrap: wrap; }
.cup { width: 30px; height: 36px; border-radius: 6px 6px 10px 10px; border: 2px solid var(--lilac); background: transparent; cursor: pointer; padding: 0; }
.cup[aria-pressed="true"] { background: var(--lilac); }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 10px 0 12px; display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--navy); }
.tab[aria-current="page"] svg { color: var(--lilac); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.month .wd { font-size: 12px; color: var(--muted); text-align: center; font-weight: 700; }
.day { aspect-ratio: 1; border: 0; border-radius: 12px; background: transparent; cursor: pointer; display: grid; align-content: center; justify-items: center; gap: 3px; font-variant-numeric: tabular-nums; font-weight: 600; padding: 0; }
.day.out { color: #c3c1cf; }
.day.today { background: var(--lilac-soft); }
.day[aria-pressed="true"] { background: var(--navy); color: #fff; }
.day .dots { display: flex; gap: 2px; height: 6px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; }
.steps { display: flex; gap: 3px; }
.steps i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
.steps i.on { background: var(--lilac); }
.menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.menu button { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-align: left; cursor: pointer; display: grid; gap: 4px; }
.menu b { font-size: 16px; }
.menu span { font-size: 13px; color: var(--muted); }
.sheet-back { position: fixed; inset: 0; background: rgba(36,54,92,.35); display: grid; align-items: end; z-index: 20; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; margin: 0 auto; border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 12px; max-height: 90vh; overflow: auto; }
.field { display: grid; gap: 4px; }
.field label { font-size: 14px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); }
.field textarea { min-height: 80px; }
.switch { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch input { width: 22px; height: 22px; accent-color: var(--navy); }
.menu-grid td, .menu-grid th { padding: 6px 4px; text-align: left; vertical-align: top; font-size: 14px; }
.menu-grid { width: 100%; border-collapse: collapse; }
.menu-grid tr + tr td { border-top: 1px solid var(--line); }
.menu-grid input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); font-size: 14px; }
.scroll-x { overflow-x: auto; }
.demo { font-size: 13px; background: var(--sage-soft); color: #3d5a39; border-radius: 12px; padding: 8px 12px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Seções"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheet"></div>
<script>
/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((new Date(a + "T12:00") - new Date(b + "T12:00")) / 864e5);
const brl = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtDate = (s) => { const d = new Date(s + "T12:00"); return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", ""); };
const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SEMANA = ["seg","ter","qua","qui","sex","sáb","dom"];
const ym = (s) => s.slice(0, 7);

const CATS = {
  Tribunal: "#24365c", Pessoal: "#9b82c9", Estudos: "#8fa98a", Saúde: "#c98b95", Treino: "#5f8fa8", Contas: "#d8b46a"
};
const ETAPAS = ["Leitura dos autos", "Entrevistas", "Visita domiciliar", "Rede (escola, CRAS, CREAS, CT)", "Testes", "Escrita e revisão", "Entregue"];
const MODULOS = {
  casos: "Casos do tribunal", agenda: "Agenda", tarefas: "Tarefas", financas: "Finanças", alimentacao: "Cardápio da semana",
  mercado: "Lista de mercado", treino: "Treino", habitos: "Hábitos e água", estudos: "Estudos", endo: "Diário de dor", lazer: "Filmes, séries, livros e jogos", pets: "Pets"
};

/* ---------- dados (exemplos marcados) ---------- */
const KEY = "fluxo-v2";
function seed() {
  return {
    demo: false, setup: false,
    nome: "",
    cfg: { frase: "", pets: [], treino: "", salario: "", meta: "Carro" },
    metaLaudos: 4,
    modulos: Object.fromEntries(Object.keys(MODULOS).map(k => [k, true])),
    silencio: "",
    eventos: [], casos: [], tarefas: [],
    fin: {
      orcamento: 3000,
      cartoes: ["Cartão 1", "Cartão 2", "Cartão 3"],
      limites: { "Compras": 400, "Roupas": 250, "Comida fora": 250, "Jogos": 100 },
      economia: 0, gastos: [], contas: [],
      carro: { alvo: 0, guardado: 0, prazo: "" },
      espera: []
    },
    cardapio: Object.fromEntries(SEMANA.map((d, i) => [d, {
      cafe: ["Tapioca com ovo", "Cuscuz com ovo", "Frutas e pão sem glúten", "Tapioca com frango", "Crepioca", "Panqueca de banana", "Livre"][i],
      almoco: ["Frango, arroz e salada", "Peixe, purê de macaxeira", "Carne moída, arroz, feijão", "Frango, batata-doce", "Peixe assado, salada", "Livre", "Livre"][i],
      jantar: ["Omelete e salada", "Sopa de legumes", "Wrap de tapioca", "Omelete", "Caldo de frango", "Livre", "Livre"][i]
    }])),
    mercado: [], agua: {}, metaAgua: 7,
    habitos: ["Ler 10 páginas", "Estudar 30 minutos", "Alongar", "Celular longe depois das 23h"].map(nome => ({ id: uid(), nome, dias: {} })),
    treinos: {}, estudos: [], endo: [], lazer: [], pets: [], pesado: {}
  };
}
/* ---------- login e nuvem (Firebase) ----------
   Cole aqui o bloco firebaseConfig do console do Firebase. Ele é público (não é senha).
   Com null, o app funciona sem login e guarda tudo só no aparelho. */
const FIREBASE = {
  apiKey: "AIzaSyDTXb6FnSc8N4ZzpKQpuvLavXtakXZkf98",
  authDomain: "fluxo-app-a4327.firebaseapp.com",
  projectId: "fluxo-app-a4327",
  storageBucket: "fluxo-app-a4327.firebasestorage.app",
  messagingSenderId: "428490126011",
  appId: "1:428490126011:web:0714fd05ec5bb8cebb6f9e"
};
const FB_VER = "10.12.2";
let fb = null, user = null, authReady = !FIREBASE, nuvem = "", cloudTimer = null, cloudBusy = false, cloudDirty = false;

let D;
try { D = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { D = seed(); }
function normalize() {
  D.cfg = Object.assign({ frase: "", pets: [], treino: "", salario: "", meta: "Carro" }, D.cfg || {});
  D.pesado = D.pesado || {}; D.pets = D.pets || [];
  D.modulos = Object.assign(Object.fromEntries(Object.keys(MODULOS).map(k => [k, true])), D.modulos || {});
}
normalize();
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {}
  if (fb && user) { cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 1200); }
};
async function pushCloud() {
  if (!fb || !user || cloudBusy || !cloudDirty) return;
  cloudBusy = true; cloudDirty = false;
  try { await fb.setDoc(fb.doc(fb.db, "usuarios", user.uid, "dados", "app"), { json: JSON.stringify(D), atualizado: Date.now() }); nuvem = "ok"; }
  catch (e) { nuvem = "erro"; cloudDirty = true; }
  cloudBusy = false;
  if (cloudDirty) cloudTimer = setTimeout(pushCloud, 5000);
}
async function initFirebase() {
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [app, auth, fs] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const a = app.initializeApp(FIREBASE);
    const au = auth.getAuth(a);
    try { await auth.setPersistence(au, auth.browserLocalPersistence); } catch (e) {}
    fb = { auth: au, db: fs.getFirestore(a), A: auth, doc: fs.doc, getDoc: fs.getDoc, setDoc: fs.setDoc };
    auth.onAuthStateChanged(au, async (u) => {
      user = u;
      if (u) {
        try {
          const snap = await fb.getDoc(fb.doc(fb.db, "usuarios", u.uid, "dados", "app"));
          if (snap.exists()) { D = JSON.parse(snap.data().json); }
          else if (D.owner && D.owner !== u.uid) { D = seed(); }
          D.owner = u.uid; normalize();
          try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {}
          if (!snap.exists()) { cloudDirty = true; pushCloud(); }
          nuvem = "ok";
        } catch (e) { nuvem = "erro"; }
      }
      authReady = true; render();
    });
  } catch (e) { authReady = true; loginErro = "Não consegui conectar. Confira a internet e abra o app de novo."; render(); }
}
let loginModo = "entrar", loginErro = "", loginMsg = "";
const ERROS = {
  "auth/invalid-email": "Esse e-mail não parece certo.",
  "auth/invalid-credential": "E-mail ou senha errados.",
  "auth/wrong-password": "Senha errada.",
  "auth/user-not-found": "Não achei conta com esse e-mail. Toque em “Criar conta”.",
  "auth/email-already-in-use": "Já existe conta com esse e-mail. Toque em “Entrar”.",
  "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
  "auth/too-many-requests": "Muitas tentativas. Espere uns minutos e tente de novo.",
  "auth/network-request-failed": "Sem internet. Confira a conexão e tente de novo."
};
function vLogin() {
  if (!authReady) return `<header class="top"><div class="brand">${TREE}Fluxo</div></header><p class="sub">Abrindo…</p>`;
  const criar = loginModo === "criar";
  return `<header class="top"><div class="brand">${TREE}Fluxo</div></header>
  <div><h1>${criar ? "Criar sua conta" : "Que bom te ver!"}</h1><p class="sub">${criar ? "Use seu e-mail e escolha uma senha (mínimo 6 caracteres)." : "Entre com seu e-mail e senha."}</p></div>
  <form class="card" id="login-form">
    <div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="l-senha">Senha</label><input id="l-senha" type="password" autocomplete="${criar ? "new-password" : "current-password"}" minlength="6" required></div>
    ${loginErro ? `<p class="pill late" style="white-space:normal">${esc(loginErro)}</p>` : ""}
    ${loginMsg ? `<p class="pill ok" style="white-space:normal">${esc(loginMsg)}</p>` : ""}
    <button class="btn" type="submit" id="l-ok">${criar ? "Criar conta" : "Entrar"}</button>
  </form>
  <div class="row" style="justify-content:space-between;flex-wrap:wrap">
    <button class="link" id="l-modo">${criar ? "Já tenho conta" : "Criar conta"}</button>
    ${criar ? "" : '<button class="link" id="l-esqueci">Esqueci a senha</button>'}
  </div>`;
}

/* ---------- navegação ---------- */
let view = "inicio", agendaDia = TODAY(), agendaMes = TODAY().slice(0, 7);
const TABS = [
  ["inicio", "Início", '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],
  ["agenda", "Agenda", '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ["casos", "Casos", '<path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>'],
  ["financas", "Dinheiro", '<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>'],
  ["mais", "Mais", '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>']
];
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function renderTabs() {
  $(".tabs").style.display = D.setup ? "" : "none";
  const main = ["inicio", "agenda", "casos", "financas"];
  const active = main.includes(view) ? view : "mais";
  $("#tabs").innerHTML = TABS.filter(([k]) => k === "inicio" || k === "mais" || D.modulos[k]).map(([k, l, p]) =>
    `<button class="tab" id="tab-${k}" data-go="${k}" ${active === k ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>${l}</button>`).join("");
  $("#tabs").style.gridTemplateColumns = `repeat(${$("#tabs").children.length}, 1fr)`;
}

const TREE = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="11" r="8" fill="#8fa98a"/><circle cx="11" cy="9" r="4.5" fill="#9b82c9" opacity=".85"/><path d="M16 12v10M16 22c-2 2-5 3-8 3M16 22c2 2 5 3 8 3M16 22v6M16 25c-1.5 1.2-3 2-5 2.5M16 25c1.5 1.2 3 2 5 2.5" stroke="#24365c" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- formulário genérico (criar e editar) ---------- */
const fid = (k) => "f-" + String(k).replace(/[^a-z0-9_]/gi, "_");
function form(title, fields, values, onSave, onDelete) {
  const v = values || {};
  $("#sheet").innerHTML = `<div class="sheet-back" id="back"><form class="sheet" id="f" role="dialog" aria-label="${esc(title)}">
    <div class="card-head"><h2>${esc(title)}</h2><button type="button" class="link" id="f-close">Fechar</button></div>
    ${fields.map(f => `<div class="field"><label for="${fid(f.k)}">${esc(f.l)}</label>${
      f.type === "select" ? `<select id="${fid(f.k)}" name="${f.k}">${f.ops.map(o => `<option ${String(v[f.k] ?? "") === String(o) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`
      : f.type === "area" ? `<textarea id="${fid(f.k)}" name="${f.k}">${esc(v[f.k])}</textarea>`
      : `<input id="${fid(f.k)}" name="${f.k}" type="${f.type || "text"}" ${f.type === "number" ? 'step="any" inputmode="decimal"' : ""} value="${esc(v[f.k])}" ${f.req ? "required" : ""}>`}</div>`).join("")}
    <div class="row"><button class="btn" type="submit" id="f-save">Salvar</button>${onDelete ? '<button class="btn danger" type="button" id="f-del">Apagar</button>' : ""}</div>
  </form></div>`;
  const close = () => { $("#sheet").innerHTML = ""; };
  $("#f-close").onclick = close;
  $("#back").onclick = (e) => { if (e.target.id === "back") close(); };
  $("#f").onsubmit = (e) => {
    e.preventDefault();
    const out = {};
    fields.forEach(f => { let x = document.getElementById(fid(f.k)).value; if (f.type === "number") x = x === "" ? "" : Number(String(x).replace(",", ".")); out[f.k] = x; });
    onSave(out); save(); close(); render();
  };
  if (onDelete) $("#f-del").onclick = () => { onDelete(); save(); close(); render(); };

const byId = (arr, id) => arr.find(x => x.id === id);
const del = (arr, id) => { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); };

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const ds = b.dataset;
  if (ds.go) return go(ds.go);
  if (ds.task) { const x = byId(D.tarefas, ds.task); x.done = !x.done; save(); return render(); }
  if (ds.editTask) { const x = byId(D.tarefas, ds.editTask); return form("Editar tarefa", tarefaFields, x, o => Object.assign(x, o), () => del(D.tarefas, x.id)); }
  if (ds.conta) { const c = byId(D.fin.contas, ds.conta), k = ym(TODAY()); c.pagos[k] = !c.pagos[k]; save(); return render(); }
  if (ds.editConta) { const c = byId(D.fin.contas, ds.editConta); return form("Editar conta", contaFields, c, o => Object.assign(c, o), () => del(D.fin.contas, c.id)); }
  if (ds.dia) { agendaDia = ds.dia; if (ym(ds.dia) !== agendaMes) agendaMes = ym(ds.dia); return render(); }
  if (ds.editEvento) { const x = byId(D.eventos, ds.editEvento); return form("Editar compromisso", evFields, x, o => Object.assign(x, o), () => del(D.eventos, x.id)); }
  if (ds.etapa) { const c = byId(D.casos, ds.etapa); c.etapa = Math.max(0, Math.min(ETAPAS.length - 1, c.etapa + Number(ds.dir))); c.entregueEm = c.etapa === ETAPAS.length - 1 ? TODAY() : ""; save(); return render(); }
  if (ds.visita) { const c = byId(D.casos, ds.visita); return form("Visita ou entrevista", evFields, { title: `${ETAPAS[c.etapa] === "Visita domiciliar" ? "Visita domiciliar" : "Entrevista"} (caso ${c.ini})`, date: addDays(TODAY(), 1), time: "09:00", cat: "Tribunal" }, o => D.eventos.push({ id: uid(), ...o })); }
  if (ds.recebi) { D.fin.gastos.forEach(g => { if (g.quem === ds.recebi) g.devolvido = true; }); save(); return render(); }
  if (ds.editPet) { const x = byId(D.pets, ds.editPet); return form("Editar lembrete", petF(), x, o => Object.assign(x, o), () => del(D.pets, x.id)); }
  if (ds.petFeito) { const x = byId(D.pets, ds.petFeito); return form("Feito! Quando é a próxima?", [{ k: "date", l: "Próxima vez", type: "date" }], { date: addDays(TODAY(), 30) }, o => { if (o.date) x.date = o.date; else del(D.pets, x.id); }); }
  if (ds.editCaso) { const c = byId(D.casos, ds.editCaso); return form("Editar caso", casoFields, { ...c, etapa: ETAPAS[c.etapa], prazoEtapa: (c.prazosEtapa || {})[c.etapa] || "" }, o => saveCaso(c, o), () => del(D.casos, c.id)); }
  if (ds.editGasto) { const x = byId(D.fin.gastos, ds.editGasto); return form("Editar gasto", gastoF(), x, o => Object.assign(x, o), () => del(D.fin.gastos, x.id)); }
  if (ds.espera) { const x = byId(D.fin.espera, ds.espera); return form("E aí, ainda quer?", [{ k: "dec", l: "Decisão", type: "select", ops: ["Desisti (economizei!)", "Comprei", "Deixa na espera"] }], {}, o => {
    if (o.dec === "Comprei") { D.fin.gastos.push({ id: uid(), date: TODAY(), desc: x.desc, val: x.val, cat: "Compras", cartao: D.fin.cartoes[0], quem: "Eu" }); del(D.fin.espera, x.id); }
    else if (o.dec.startsWith("Desisti")) { D.fin.economia = (Number(D.fin.economia) || 0) + (Number(x.val) || 0); del(D.fin.espera, x.id); }
  }); }
  if (ds.merc) { const x = byId(D.mercado, ds.merc); x.done = !x.done; save(); return render(); }
  if (ds.delMerc) { del(D.mercado, ds.delMerc); save(); return render(); }
  if (ds.treino) { const d = ds.treino; if (D.treinos[d]) delete D.treinos[d]; else D.treinos[d] = { min: 120, obs: "" }; save(); return render(); }
  if (ds.cup) { const t = TODAY(), n = Number(ds.cup); D.agua[t] = (D.agua[t] || 0) === n ? n - 1 : n; save(); return render(); }
  if (ds.hab) { const h = byId(D.habitos, ds.hab), t = TODAY(); if (h.dias[t]) delete h.dias[t]; else h.dias[t] = true; save(); return render(); }
  if (ds.editHab) { const h = byId(D.habitos, ds.editHab); return form("Editar hábito", [{ k: "nome", l: "Hábito", req: true }], h, o => Object.assign(h, o), () => del(D.habitos, h.id)); }
  if (ds.est) { const x = byId(D.estudos, ds.est); x.done = !x.done; save(); return render(); }
  if (ds.editEst) { const x = byId(D.estudos, ds.editEst); return form("Editar", estFields, x, o => Object.assign(x, o), () => del(D.estudos, x.id)); }
  if (ds.editEndo) { const x = byId(D.endo, ds.editEndo); return form("Editar registro", endoFields, x, o => Object.assign(x, o), () => del(D.endo, x.id)); }
  if (ds.receita) { const d = SEMANA[(new Date().getDay() + 6) % 7]; D.cardapio[d].jantar = RECEITAS[Number(ds.receita)][0]; save(); return render(); }
  if (ds.laz) { const x = byId(D.lazer, ds.laz); x.done = !x.done; save(); return render(); }
  if (ds.editLaz) { const x = byId(D.lazer, ds.editLaz); return form("Editar", lazFields, x, o => Object.assign(x, o), () => del(D.lazer, x.id)); }

  switch (b.id) {
    case "l-modo": loginModo = loginModo === "criar" ? "entrar" : "criar"; loginErro = ""; loginMsg = ""; return render();
    case "l-esqueci": {
      const email = $("#l-email").value.trim();
      if (!email) { loginErro = "Escreva seu e-mail no campo acima e toque de novo em “Esqueci a senha”."; return render(); }
      fb.A.sendPasswordResetEmail(fb.auth, email).then(() => { loginErro = ""; loginMsg = "Mandei um e-mail para criar uma senha nova. Olhe também o spam."; render(); }).catch(err => { loginErro = ERROS[err.code] || "Não deu certo. Tente de novo."; render(); });
      return;
    }
    case "sair": return form("Sair da conta?", [{ k: "ok", l: "Seus dados continuam salvos na nuvem. Escreva SAIR para confirmar", req: true }], {}, async o => {
      if (String(o.ok).trim().toUpperCase() !== "SAIR") return;
      cloudDirty = true; await pushCloud();
      clearTimeout(cloudTimer); cloudDirty = false; user = null;
      try { localStorage.removeItem(KEY); } catch (e) {}
      D = seed(); normalize(); view = "inicio"; loginModo = "entrar"; loginErro = ""; loginMsg = ""; await fb.A.signOut(fb.auth);
    });
    case "add-evento": return form("Novo compromisso", evFields, { date: agendaDia, time: "09:00", cat: "Pessoal" }, o => D.eventos.push({ id: uid(), ...o }));
    case "mes-prev": case "mes-next": { const [y, m] = agendaMes.split("-").map(Number); const d = new Date(y, m - 1 + (b.id === "mes-next" ? 1 : -1), 1); agendaMes = iso(d).slice(0, 7); return render(); }
    case "add-caso": return form("Novo caso", casoFields, { etapa: ETAPAS[0] }, o => { const c = { id: uid(), prazosEtapa: {} }; D.casos.push(c); saveCaso(c, o); });
    case "pesado": { const t = TODAY(); if (D.pesado[t]) delete D.pesado[t]; else D.pesado[t] = true; save(); return render(); }
    case "add-pet": return form("Novo lembrete", petF(), { pet: petF()[0].ops.slice(-1)[0], oque: "Banho", date: addDays(TODAY(), 7) }, o => D.pets.push({ id: uid(), ...o }));
    case "edit-limites": return form("Limites por categoria (R$ por mês)", LIMCATS.map(k => ({ k, l: k, type: "number" })), D.fin.limites, o => { D.fin.limites = {}; Object.entries(o).forEach(([k, v]) => { if (v) D.fin.limites[k] = v; }); });
    case "edit-cartoes": return form("Seus cartões", [{ k: "nomes", l: "Nomes, separados por vírgula", req: true }], { nomes: D.fin.cartoes.join(", ") }, o => D.fin.cartoes = o.nomes.split(",").map(x => x.trim()).filter(Boolean));
    case "copiar-endo": { const txt = resumoEndo(); try { navigator.clipboard.writeText(txt); b.textContent = "Copiado!"; } catch (e) { b.textContent = "Não deu para copiar"; } return; }
    case "backup": { try { navigator.clipboard.writeText(JSON.stringify(D)); b.textContent = "Cópia feita! Cole num lugar seguro (ex.: um e-mail para você)."; } catch (e) { b.textContent = "Não deu para copiar neste aparelho"; } return; }
    case "restaurar": return form("Restaurar cópia de segurança", [{ k: "json", l: "Cole aqui o texto da cópia", type: "area", req: true }], {}, o => { try { const x = JSON.parse(o.json); if (x && x.fin) D = x; } catch (e) {} });
    case "add-gasto": return form("Novo gasto", gastoF(), { date: TODAY(), cat: "Compras", cartao: D.fin.cartoes[0], quem: "Eu" }, o => D.fin.gastos.push({ id: uid(), ...o, quem: (o.quem || "Eu").trim() || "Eu", devolvido: false }));
    case "add-conta": return form("Nova conta", contaFields, { dia: 10 }, o => D.fin.contas.push({ id: uid(), pagos: {}, ...o }));
    case "edit-orc": return form("Limite de gastos do mês", [{ k: "orcamento", l: "Valor (R$)", type: "number", req: true }], D.fin, o => D.fin.orcamento = o.orcamento);
    case "edit-carro": return form("Minha meta", [{ k: "alvo", l: "Quanto custa (R$)", type: "number" }, { k: "guardado", l: "Quanto já guardei (R$)", type: "number" }, { k: "prazo", l: "Até quando (mês)", type: "month" }], D.fin.carro, o => Object.assign(D.fin.carro, o));
    case "add-espera": return form("Vontade de comprar", [{ k: "desc", l: "O quê", req: true }, { k: "val", l: "Quanto (R$)", type: "number" }], {}, o => D.fin.espera.push({ id: uid(), criado: TODAY(), ...o }));
    case "add-tarefa": return form("Nova tarefa", tarefaFields, { cat: "Pessoal" }, o => D.tarefas.push({ id: uid(), done: false, ...o }));
    case "add-mercado": return form("Item do mercado", [{ k: "t", l: "Item", req: true }], {}, o => D.mercado.push({ id: uid(), done: false, ...o }));
    case "limpar-mercado": D.mercado = D.mercado.filter(x => !x.done); save(); return render();
    case "gerar-lista": {
      const norm = (x) => x.toLowerCase().replace(/s$/, "");
      const ja = new Set(D.mercado.map(x => norm(x.t)));
      const itens = new Set();
      SEMANA.forEach(d => ["cafe", "almoco", "jantar"].forEach(r => String(D.cardapio[d][r]).split(/,| e | com /).map(s => s.trim()).filter(s => s && !/^livre$/i.test(s)).forEach(s => itens.add(s.charAt(0).toUpperCase() + s.slice(1)))));
      let n = 0; itens.forEach(s => { if (!ja.has(norm(s))) { ja.add(norm(s)); D.mercado.push({ id: uid(), t: s, done: false }); n++; } });
      save(); view = "mercado"; render(); return;
    }
    case "treino-tempo": { const t = TODAY(); return form("Tempo de treino", [{ k: "min", l: "Minutos", type: "number" }], D.treinos[t], o => D.treinos[t].min = o.min); }
    case "add-habito": return form("Novo hábito", [{ k: "nome", l: "Hábito", req: true }], {}, o => D.habitos.push({ id: uid(), dias: {}, ...o }));
    case "add-estudo": return form("Novo item de estudo", estFields, { tipo: "Curso" }, o => D.estudos.push({ id: uid(), done: false, ...o }));
    case "add-endo": return form("Registro de hoje", endoFields, { date: TODAY(), dor: 3 }, o => D.endo.push({ id: uid(), ...o }));
    case "add-lazer": return form("Novo item", lazFields, { tipo: "Série" }, o => D.lazer.push({ id: uid(), done: false, ...o }));
    case "zerar": return form("Apagar tudo?", [{ k: "ok", l: "Escreva APAGAR para confirmar", req: true }], {}, o => {
      if (String(o.ok).trim().toUpperCase() === "APAGAR") { const s = seed(); D = { ...s, demo: false, nome: D.nome, modulos: D.modulos, eventos: [], casos: [], tarefas: [], mercado: [], habitos: [], treinos: {}, estudos: [], endo: [], lazer: [], pets: [], pesado: {}, agua: {}, fin: { ...s.fin, economia: 0, gastos: [], contas: [], espera: [], carro: { alvo: 0, guardado: 0, prazo: "" } } }; }
    });
  }
});
const estFields = [{ k: "t", l: "O quê", req: true }, { k: "tipo", l: "Tipo", type: "select", ops: ["Curso", "Leitura", "Teste e material"] }];
const endoFields = [{ k: "date", l: "Dia", type: "date" }, { k: "dor", l: "Dor (0 a 10)", type: "number" }, { k: "remedio", l: "Remédio que tomou (se tomou)" }, { k: "comida", l: "A comida do dia…", type: "select", ops: ["Não sei", "Piorou", "Melhorou", "Não mudou"] }, { k: "obs", l: "Observação", type: "area" }];
const lazFields = [{ k: "t", l: "Título", req: true }, { k: "tipo", l: "Tipo", type: "select", ops: ["Filme", "Série", "Livro", "Jogo"] }];
const petsNome = () => D.cfg.pets.length ? D.cfg.pets.join(" e ") : "Pets";
const petF = () => [{ k: "pet", l: "Quem", type: D.cfg.pets.length ? "select" : "text", ops: D.cfg.pets.length > 1 ? [...D.cfg.pets, D.cfg.pets.join(" e ")] : D.cfg.pets }, { k: "oque", l: "O quê", type: "select", ops: ["Banho", "Vermífugo", "Vacina", "Antipulgas", "Veterinário", "Ração", "Outro"] }, { k: "date", l: "Quando", type: "date" }];

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "login-form") return;
  e.preventDefault();
  const email = $("#l-email").value.trim(), senha = $("#l-senha").value;
  loginErro = ""; loginMsg = ""; $("#l-ok").disabled = true;
  try {
    if (loginModo === "criar") await fb.A.createUserWithEmailAndPassword(fb.auth, email, senha);
    else await fb.A.signInWithEmailAndPassword(fb.auth, email, senha);
  } catch (err) { loginErro = ERROS[err.code] || "Não deu certo. Tente de novo."; render(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "setup-form") return;
  e.preventDefault();
  const v = (k) => document.getElementById("s-" + k).value.trim();
  D.nome = v("nome");
  D.cfg = { frase: v("frase"), pets: v("pets").split(",").map(x => x.trim()).filter(Boolean), treino: v("treino"), salario: v("salario"), meta: v("meta") || "Meta" };
  D.fin.carro = { alvo: Number(v("alvo")) || 0, guardado: Number(v("guardado")) || 0, prazo: v("prazo") };
  D.metaLaudos = Number(v("laudos")) || 4;
  D.silencio = v("silencio");
  if (!D.cfg.pets.length) D.modulos.pets = false; else if (!D.setup) D.modulos.pets = true;
  D.setup = true; save(); go("inicio");
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.card) { const [d, r] = t.dataset.card.split("."); D.cardapio[d][r] = t.value; save(); }
  if (t.id === "nome") { D.nome = t.value; save(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.mod) { D.modulos[t.dataset.mod] = t.checked; save(); renderTabs(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheet").innerHTML) $("#sheet").innerHTML = ""; });

render();
if (FIREBASE) initFirebase();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
